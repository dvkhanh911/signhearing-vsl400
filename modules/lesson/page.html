<section class="lesson-page" aria-labelledby="lesson-page-title" data-lesson-id="{{lesson.id}}">
  <div class="sh-page-head">
    <p class="sh-eyebrow">{{lesson.module_label}}</p>
    <h1 id="lesson-page-title">{{lesson.heading}}</h1>
    <p class="sh-lead">{{lesson.lead}}</p>
    <div class="lesson-meta">
      <span>{{lesson.sign_count}}</span>
      {{lesson.sample.html}}
      <span class="sh-badge" data-lesson-state aria-live="polite" hidden></span>
    </div>
  </div>
  <div class="lesson-layout">
    <nav class="sh-card lesson-nav" aria-labelledby="lesson-nav-title">
      <h2 id="lesson-nav-title">{{lesson.contents}}</h2>
      <div class="lesson-progress" data-progress hidden>
        <p data-seen-count aria-live="polite" aria-atomic="true"></p>
        <div class="sh-progress" aria-hidden="true"><span data-progress-bar></span></div>
      </div>
      <ol class="lesson-sign-list">{{lesson.list.html}}</ol>
    </nav>
    <div class="lesson-study">
      <div class="lesson-navigation" data-navigation hidden role="group" aria-label="{{lesson.navigation}}">
        <button class="sh-chip" type="button" data-previous>{{lesson.previous}}</button>
        <p data-position aria-live="polite" aria-atomic="true"></p>
        <button class="sh-chip" type="button" data-next>{{lesson.next}}</button>
      </div>
      <div class="lesson-articles">{{lesson.articles.html}}</div>
    </div>
  </div>
  <footer class="lesson-footer">
    <p class="lesson-ready" data-ready role="status" hidden>{{lesson.ready}}</p>
    <div class="lesson-footer-actions">
      <a class="lesson-back" href="{{lesson.courses_url}}">{{lesson.back}}</a>
      {{lesson.quiz.html}}
    </div>
  </footer>
</section>
