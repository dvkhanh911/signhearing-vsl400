<section class="dictionary-page" aria-labelledby="dictionary-page-title">
  <div class="sh-page-head">
    <p class="sh-eyebrow">{{dictionary.eyebrow}}</p>
    <h1 id="dictionary-page-title">{{dictionary.title}}</h1>
    <p class="sh-lead">{{dictionary.lead}}</p>
  </div>
  {{dictionary.collection_summary.html}}
  <div class="sh-card dictionary-toolbar" data-toolbar hidden>
    <div class="dictionary-search" role="search" aria-label="{{dictionary.search.label}}">
      <label for="dictionary-search">{{dictionary.search.label}}</label>
      <input id="dictionary-search" type="search" data-search-input placeholder="{{dictionary.search.placeholder}}" aria-describedby="dictionary-search-hint" aria-controls="dictionary-results" autocomplete="off" spellcheck="false">
      <p id="dictionary-search-hint">{{dictionary.search.hint}}</p>
    </div>
    <div class="dictionary-filters" role="group" aria-label="{{dictionary.filter.label}}">
      <button class="sh-chip" type="button" data-module-filter="all" aria-pressed="true">{{dictionary.filter.all}}</button>
      {{dictionary.filters.html}}
    </div>
    <div class="dictionary-favorites-filter">
      <button class="sh-chip" type="button" data-favorites-filter aria-pressed="false">{{dictionary.filter.favorites}}</button>
    </div>
  </div>
  <p class="dictionary-result-count" data-result-count role="status" aria-live="polite" aria-atomic="true">{{dictionary.result_count}}</p>
  <ul id="dictionary-results" class="dictionary-grid">{{dictionary.cards.html}}</ul>
  <div class="sh-card sh-empty dictionary-empty" data-empty{{dictionary.empty_hidden.html}}>
    <img src="/static/assets/mascot.png" width="1351" height="1164" alt="">
    <h2>{{dictionary.empty.title}}</h2>
    <p>{{dictionary.empty.body}}</p>
    <button class="button button-outline" type="button" data-clear-filters hidden>{{dictionary.filter.clear}}</button>
  </div>
</section>
